version: '3'

vars:
  # The GEDCOM 7 specification commit the vendored grammar comes from.
  # The extracted ABNF lags the release tags (7.0.18's tag still carries the
  # 7.0.17 Longitude typo), so it is pinned to a commit on main, not a tag.
  GEDCOM7_COMMIT: 073b78b2f43027eb513de394344b3b3e4bba0489
  # The GEDCOM.io commit the test files under gedcom7/testdata come from.
  GEDCOMIO_COMMIT: c52d510324ecf961b3632834e7948afb771513e6
  GEDCOMIO_TESTFILES: age date escapes extension-record extensions filename-1 lang long-url maximal70-lds maximal70-memories1 maximal70-memories2 maximal70-tree1 maximal70-tree2 maximal70 minimal70 notes-1 obje-1 remarriage1 remarriage2 same-sex-marriage voidptr warnings70 xref

tasks:
  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...
  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...
  test:
    desc: Run the tests
    cmds:
      - go test ./...
  check:
    desc: fmt, vet, test
    cmds:
      - task: fmt
      - task: vet
      - task: test
  deps:tidy:
    desc: Tidy the Go module
    cmds:
      - go mod tidy

  grammar:fetch:
    desc: Refetch the GEDCOM 7 ABNF from the specification repository at GEDCOM7_COMMIT
    cmds:
      - curl -sSfL -o gedcom7/grammar.abnf https://raw.githubusercontent.com/FamilySearch/GEDCOM/{{.GEDCOM7_COMMIT}}/extracted-files/grammar.abnf
      - curl -sSfL -o gedcom7/LICENSE.gedcom https://raw.githubusercontent.com/FamilySearch/GEDCOM/{{.GEDCOM7_COMMIT}}/LICENSE
      - echo "{{.GEDCOM7_COMMIT}}" > gedcom7/grammar.commit

  registry:fetch:
    desc: Refetch the GEDCOM 7 registry (extracted-files/tags, one YAML per term) at GEDCOM7_COMMIT into gedcom7/registry
    cmds:
      - rm -rf .task/spec && mkdir -p .task/spec
      - curl -sSfL https://github.com/FamilySearch/GEDCOM/archive/{{.GEDCOM7_COMMIT}}.tar.gz | tar -xzf - -C .task/spec --strip-components=3 --wildcards '*/extracted-files/tags/*'
      - rm -rf gedcom7/registry && mv .task/spec gedcom7/registry

  testdata:fetch:
    desc: Refetch the specification's GEDCOM 7 test files (GEDCOM.io testfiles/gedcom70) at GEDCOMIO_COMMIT into gedcom7/testdata/gedcom70
    cmds:
      - mkdir -p gedcom7/testdata/gedcom70
      - for f in {{.GEDCOMIO_TESTFILES}}; do curl -sSfL -o gedcom7/testdata/gedcom70/$f.ged https://raw.githubusercontent.com/FamilySearch/GEDCOM.io/{{.GEDCOMIO_COMMIT}}/testfiles/gedcom70/$f.ged; done

  grammar:generate:
    desc: 'The tree-sitter chain for one grammar (GRAMMAR=gedcom7|gedcom551): grammar/G/G.abnf -> grammar.json -> parser.c -> G/grammar_blobs/G.bin'
    vars:
      GRAMMAR: '{{.GRAMMAR | default "gedcom7"}}'
    dir: grammar/{{.GRAMMAR}}
    preconditions:
      - sh: which tree-sitter2abnf
        msg: "tree-sitter2abnf not found: go install git.bytestone.uk/hum3/tree-sitter2abnf/cmd/tree-sitter2abnf@latest"
    cmds:
      - tree-sitter2abnf -o src/grammar.json {{.GRAMMAR}}.abnf
      - npx --prefix .. tree-sitter-cli generate src/grammar.json
      - go run git.bytestone.uk/hum3/gotreesitter/cmd/ts2go -input src/parser.c -output ../../{{.GRAMMAR}}/grammar_gen.go -package {{.GRAMMAR}} -name {{.GRAMMAR}}
  grammar:test:
    desc: Run the tree-sitter corpus of one grammar (GRAMMAR=gedcom7|gedcom551) under grammar/G/test/corpus (needs a C compiler)
    vars:
      GRAMMAR: '{{.GRAMMAR | default "gedcom7"}}'
    dir: grammar/{{.GRAMMAR}}
    cmds:
      - npx --prefix .. tree-sitter-cli test

  docs:build:
    desc: Render the docs into docs/ (landing page, stories, diagrams)
    cmds:
      - task-plus md2html --file index.md --dst docs
      - for f in docs/stories/*.md; do task-plus md2html --file "$f" --dst docs/stories; done
      - for f in docs/*.d2; do [ -e "$f" ] && d2 --scale 1 "$f" "${f%.d2}.svg" || true; done

  clean:
    desc: Remove build output
    cmds:
      - rm -rf docs/*.html docs/*.svg docs/stories/*.html gogedcom grammar/*/src/tree_sitter grammar/node_modules
